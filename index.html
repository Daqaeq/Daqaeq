<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1311">
<title>دقايق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#0E1311;--card:#171D1B;--tile:#1F2724;--g:#1FD17C;--t:#FFFFFF;--m:#A9B3AF;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;min-height:100vh;background:var(--bg);color:var(--t);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2{margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px}
.top small{color:var(--m);display:block;font-size:13px}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--tile);color:var(--g);display:grid;place-items:center}
.pad{padding:0 20px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px 20px 12px;text-align:center;font-size:13px}
.cat{background:none;border:0;padding:0}
.cat i{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 6px;border-radius:20px;background:var(--tile);color:var(--g);border:2px solid transparent}
.cat.on i{border-color:var(--g)}
.chips{display:flex;gap:8px;padding:8px 20px 12px}
.chip{min-height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--tile)}
.chip.on{background:var(--g);color:#0E1311;font-weight:700}
h3{margin:8px 20px 10px;font-size:17px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 20px 8px}
.hs .card{width:190px;flex:none;margin:0}
.card{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:0;border-radius:20px;padding:14px;margin-bottom:12px;text-align:start}
.av{width:52px;height:52px;border-radius:16px;background:var(--tile);color:var(--g);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.card b{display:block;font-size:16px}
.card span,.mu{color:var(--m);font-size:14px}
.tag{display:inline-block;background:var(--g);color:#0E1311;border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.price{color:var(--g);font-weight:700;font-size:15px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:44px;height:44px;border-radius:50%;border:0;background:var(--tile);font-size:22px}
.qty .add{background:var(--g);color:#0E1311;font-weight:700}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--g);color:#0E1311;font-weight:700;font-size:17px}
.btn.s{background:var(--tile);color:var(--g);min-height:44px;font-size:15px;width:auto;padding:0 16px}
.bar{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));left:0;right:0;max-width:480px;margin:0 auto;padding:10px 20px;background:var(--bg)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--tile)}
.nav button{flex:1;min-height:64px;border:0;background:none;color:var(--m);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.nav button.on{color:var(--g);font-weight:700}
.nav em{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);background:var(--g);color:#0E1311;border-radius:9px;min-width:18px;height:18px;font-size:11px;font-style:normal;display:grid;place-items:center;font-weight:700}
input,textarea{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--tile);background:var(--card);color:var(--t);font:inherit;padding:12px 14px;margin:6px 0 14px}
input:focus,textarea:focus{outline:none;border-color:var(--g)}
label{color:var(--m);font-size:14px}
.back{min-height:44px;background:none;border:0;color:var(--g);font-weight:700}
.sum{display:flex;justify-content:space-between;padding:6px 0;color:var(--m)}
.sum.tot{color:var(--t);font-weight:700;font-size:18px;border-top:1px solid var(--tile);margin-top:8px;padding-top:14px}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:90vh;padding:0 28px}
.note{color:var(--m);font-size:13px;text-align:center;padding:8px 20px}
.rt{position:relative;height:104px;margin:12px 24px}
.ln,.fl{position:absolute;top:46px;right:0;height:6px;border-radius:3px;background:var(--tile)}
.ln{left:0}.fl{background:var(--g)}
.nd{position:absolute;top:28px;width:42px;height:42px;border-radius:50%;background:var(--tile);color:var(--m);display:grid;place-items:center;border:2px solid var(--tile)}
.nd.ok{border-color:var(--g);color:var(--g)}
.nl{position:absolute;top:76px;font-size:12px;color:var(--m);transform:translateX(50%);white-space:nowrap}
.bk{position:absolute;top:26px;width:46px;height:46px;border-radius:50%;background:var(--g);color:#0E1311;display:grid;place-items:center;transform:translateX(50%)}
.big{font-size:22px}
.rb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;padding:6px 12px;background:#000;font-size:12px;color:var(--m);overflow-x:auto}
.rb .chip{min-height:36px;padding:0 14px;font-size:13px;flex:none}
#ts{display:none;position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:456px;margin:0 auto;z-index:9;background:var(--g);color:#0E1311;font-weight:700;padding:12px 16px;border-radius:14px}
.stars{display:flex;justify-content:center;gap:4px;margin:8px 0}.stars button{width:44px;height:44px;border:0;background:none;color:var(--m)}.stars .on{color:var(--g)}
.map{border-radius:14px;overflow:hidden;margin:6px 0 10px}
</style>
</head>
<body>
<div id="ts" role="status"></div><div id="app"></div>
<div id="nav"></div>
<script>
var P={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',cart:'<path d="M3 4h3l2 11h9l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',coupon:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M10 7v10" stroke-dasharray="2 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h4l4 8M10 8H8M14 8l-3 8"/>',pin:'<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',store:'<path d="M4 9l1-5h14l1 5M5 9v11h14V9M9 20v-6h6v6"/><path d="M4 9a3 3 0 0 0 6 0 3 3 0 0 0 4 0 3 3 0 0 0 6 0"/>',pct:'<path d="M6 18L18 6"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',cup:'<path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/>',ok:'<path d="M5 13l4 4L19 7"/>'};
var I=function(n,s){return '<svg width="'+(s||24)+'" height="'+(s||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'};
var LOGO=function(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 120 120" role="img" aria-label="دقايق"><rect width="120" height="120" rx="28" fill="#1F2724"/><g transform="rotate(12 60 60)"><path d="M60 100C60 100 28 72 28 50A32 32 0 0 1 92 50C92 72 60 100 60 100Z" fill="#1FD17C"/><path d="M51 34V48M60 34V48M69 34V48M51 48Q60 58 69 48M60 55V72" stroke="#0E1311" stroke-width="4" stroke-linecap="round" fill="none"/></g></svg>'};
var R=[
{n:'باربكيو تشكن',k:'غربي',t:25,d:1,m:[['ربع دجاج مشوي مع رز',7000],['وجبة دجاج مقلي',8000],['ساندويج زنجر',4500],['بطاطا مقلية',3000]]},
{n:'بسكوت',k:'غربي',t:20,m:[['برغر لحم',6000],['بيتزا مارغريتا',9000],['باستا كريمة',8000],['عصير طبيعي',3000]]},
{n:'ليون',k:'غربي',t:30,w:1,m:[['برغر دبل',7500],['ستيك دجاج',9500],['سلطة سيزر',4000],['ناكتس',5000]]},
{n:'مندي الأصيل',k:'شرقي',t:35,d:1,m:[['مندي دجاج',8000],['مندي لحم',10000],['رز بخاري',5000],['شوربة',3000]]},
{n:'مندي أبو الخصيب',k:'شرقي',t:35,m:[['مندي دجاج نص',9000],['مندي لحم',10000],['مضغوط دجاج',8500],['لبن',3000]]},
{n:'أبو فاطمة',k:'شرقي',t:30,m:[['تشريب لحم',6500],['باجة',7000],['كباب مع خبز',8000],['سلطة',3000]]},
{n:'حيدر عسكر',k:'شرقي',t:25,w:1,m:[['تكة لحم',9500],['لفة شاورما',4000],['فلافل',3000],['عمبة وبيض',3500]]},
{n:'كافيه ١ (تجريبي)',k:'حلويات ومشروبات',t:15,s:1,w:1,m:[['كيك شوكولاتة',5000],['آيس لاتيه',4500],['كريب نوتيلا',6000],['موهيتو',3500]]},
{n:'حلويات ٢ (تجريبي)',k:'حلويات ومشروبات',t:20,s:1,d:1,m:[['كنافة',4000],['بقلاوة',5000],['عصير رمان',3000],['شاي كرك',3000]]}
];
Object.assign(P,{help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>'});
var FEE=2000,CM=0.1,DF=1500,ST=['new','prep','ready','drv','pick','way','done','x'],S={s:'login',r:null,f:'الكل',cat:null,c:{},cp:null,u:null,role:'c',OR:[],cur:null,pr:0},$=document.getElementById('app'),Z=document.getElementById('ts');
try{S.OR=JSON.parse(localStorage.getItem('dq_or')||'[]')}catch(e){}
var save=function(){try{localStorage.setItem('dq_or',JSON.stringify(S.OR.slice(0,30)))}catch(e){}};
var TG={new:0,prep:6,ready:6,drv:50,pick:58,way:100,done:100,x:0};
var LB={new:'تم تثبيت طلبك، بانتظار المطعم',prep:'المطعم يحضّر طلبك',ready:'طلبك جاهز، بانتظار الكابتن',drv:'الكابتن بالطريق إلى المطعم',pick:'الكابتن استلم طلبك من المطعم',way:'الكابتن بالطريق إليك',done:'وصل طلبك، بالعافية',x:'تم إلغاء الطلب'};
var fmt=function(n){return Math.round(n).toLocaleString('en-US')+' د.ع'};
var find=function(id){return S.OR.filter(function(o){return o.id===id})[0]};
var sub=function(){var t=0;for(var k in S.c)t+=S.c[k]*R[S.r].m[k][1];return t};
var cnt=function(){var t=0;for(var k in S.c)t+=S.c[k];return t};
var disc=function(){return S.cp==='p10'?sub()*0.1:0};
var fee=function(){return S.cp==='free'?0:FEE};
var tot=function(){return sub()-disc()+fee()};
var live=function(o){return o.st!=='done'&&o.st!=='x'};
function note(t){Z.textContent='إشعار: '+t;Z.style.display='block';clearTimeout(note.t);note.t=setTimeout(function(){Z.style.display='none'},3500)}
function ss(id,st,m){var o=find(id);o.st=st;save();note((m?m+' · ':'')+LB[st]);render()}
function go(s,r){S.s=s;if(r!==undefined&&r!==S.r){S.r=r;S.c={};S.cp=null}render();window.scrollTo(0,0)}
function role(x){S.role=x;S.s=x==='c'?(S.u?'home':'login'):'panel';render()}

function bad(e){e.style.borderColor='#ff6b6b'}
function login(){var n=document.getElementById('nm'),p=document.getElementById('ph'),ok=true;if(!n.value.trim()){bad(n);ok=false}if(p.value.trim().length<10){bad(p);ok=false}if(!ok)return;S.u={n:n.value.trim(),p:p.value.trim()};go('otp')}

setInterval(function(){var ch=0;S.OR.forEach(function(o){var t=TG[o.st];if(o.st!=='x'&&o.p<t){o.p=Math.min(t,o.p+2);ch=1}});if(ch&&S.s==='track'&&S.role==='c')render()},1000);
function nav(){var n=document.getElementById('nav');if(S.role!=='c'||S.s==='login'||S.s==='otp'||S.s==='roles'){n.innerHTML='';return}var t=S.s==='menu'?'home':S.s,h='<nav class="nav" aria-label="التنقل">';[['home','الرئيسية','home'],['orders','الطلبات','orders'],['cart','السلة','cart'],['coupons','القسائم','coupon'],['account','الحساب','user']].forEach(function(x){h+='<button class="'+(t===x[0]||(x[0]==='orders'&&S.s==='track')?'on':'')+'" onclick="go(\''+x[0]+'\')">'+I(x[2])+x[1]+(x[0]==='cart'&&cnt()?'<em>'+cnt()+'</em>':'')+'</button>'});n.innerHTML=h+'</nav>'}
function rbar(){var h='<div class="rb"><span>عرض تجريبي:</span>';[['c','زبون'],['r','مطعم'],['d','كابتن'],['a','إدارة']].forEach(function(x){h+='<button class="chip'+(S.role===x[0]?' on':'')+'" onclick="role(\''+x[0]+'\')">'+x[1]+'</button>'});return h+'</div>'}
function head(){return '<div class="top">'+LOGO(46)+'<div><h2>دقايق</h2><small>التوصيل إلى: أبو الخصيب، البصرة</small></div><div class="sp"></div><button class="ib" aria-label="بحث" onclick="go(\'search\')">'+I('search')+'</button><button class="ib" aria-label="الرئيسية" onclick="go(\'home\')">'+I('home')+'</button></div>'}

function srch(){var v=document.getElementById('sq').value.trim(),h='';if(v){R.forEach(function(r,i){if(r.n.indexOf(v)>-1)h+=card(i);r.m.forEach(function(m){if(m[0].indexOf(v)>-1)h+='<button class="card" onclick="go(\'menu\','+i+')"><div class="av">'+I('cup')+'</div><div><b>'+m[0]+'</b><span>'+r.n+' · '+fmt(m[1])+'</span></div></button>'})});if(!h)h='<p class="note">ما لكينا نتيجة</p>'}document.getElementById('sr').innerHTML=h}
